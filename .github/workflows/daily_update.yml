name: Mise à jour des données ENTSO-E

on:
  schedule:
    # Exécution automatique tous les jours à 06:00 UTC (prend les 7 derniers jours par défaut)
    - cron: '0 6 * * *'
  
  # Déclenchement manuel avec saisie de dates
  workflow_dispatch:
    inputs:
      start_date:
        description: 'Date de début (YYYY-MM-DD)'
        required: false
        default: ''
      end_date:
        description: 'Date de fin (YYYY-MM-DD)'
        required: false
        default: ''

jobs:
  update-data:
    runs-on: ubuntu-latest

    steps:
      - name: Extraire le code du dépôt
        uses: actions/checkout@v4

      - name: Configurer Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'

      - name: Installer les dépendances
        run: |
          python -m pip install --upgrade pip
          pip install pandas entsoe-py

      - name: Exécuter le script Python avec les dates configurées
        env:
          ENTSOE_API_KEY: ${{ secrets.ENTSOE_API_KEY }}
          INPUT_START_DATE: ${{ github.event.inputs.start_date }}
          INPUT_END_DATE: ${{ github.event.inputs.end_date }}
        run: |
          python generate_data.py

      - name: Commit et Push du fichier data.json mis à jour
        run: |
          git config --global user.name "github-actions[bot]"
          git config --global user.email "github-actions[bot]@users.noreply.github.com"
          git add data.json
          git diff-index --quiet HEAD || (git commit -m "🤖 Update data.json for custom dates [skip ci]" && git push)

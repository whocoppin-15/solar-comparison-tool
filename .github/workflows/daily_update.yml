name: Mise à jour quotidienne des données ENTSO-E

on:
  schedule:
    # Exécution automatique tous les jours à 06:00 UTC (07:00 / 08:00 heure française)
    - cron: '0 6 * * *'
  # Permet aussi de déclencher le workflow manuellement depuis l'onglet Actions
  workflow_dispatch:

jobs:
  update-data:
    runs-on: ubuntu-latest

    steps:
      - name: Extraire le code du dépôt
        uses: actions/checkout@v4

      - name: Configurer Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'

      - name: Installer les dépendances
        run: |
          python -m pip install --upgrade pip
          pip install pandas entsoe-py

      - name: Exécuter le script Python
        env:
          ENTSOE_API_KEY: ${{ secrets.ENTSOE_API_KEY }}
        run: |
          python generate_data.py

      - name: Commit et Push du fichier data.json mis à jour
        run: |
          git config --global user.name "github-actions[bot]"
          git config --global user.email "github-actions[bot]@users.noreply.github.com"
          git add data.json
          git status
          git diff-index --quiet HEAD || (git commit -m "🤖 Auto-update data.json [skip ci]" && git push)
